[env:atoms3lite]
platform  = espressif32
board     = m5stack-atoms3
framework = arduino

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    adafruit/Adafruit NeoPixel@^1.12.3

; Native USB as HID keyboard only — no CDC serial on the USB-C port.
; Debug output goes to Serial1 on the Grove connector (GPIO 1 TX / GPIO 2 RX).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Connect a 3.3 V UART adapter to the Grove port to see Serial1 output.
; Adjust the port to match your adapter device node.
; monitor_port  = /dev/tty.usbserial-*
monitor_speed = 115200
